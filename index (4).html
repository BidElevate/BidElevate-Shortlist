<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your Tender Shortlist | BidElevate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<script>
  /* SETTINGS: the only lines you might ever need to change */
  const CONFIG = {
    EMAILJS_PUBLIC_KEY: "ZxayBeLVQRYJoLquJ",
    EMAILJS_SERVICE_ID: "service_yf3sg5y",
    EMAILJS_TEMPLATE_ID: "template_tjoazuj",        // Shortlist Selection template
    NOTIFY_EMAIL: "hello@bidelevate.co.uk",           // where selections are sent (you)
    BOOKING_URL: "https://book.bidelevate.co.uk",
    PHONE: "020 3488 5214"
  };
</script>
<style>
:root{
  --bg:#f5f7f4; --surface:#ffffff; --ink:#1f2b27; --muted:#5d6b66; --line:#dbe2dd;
  --brand:#3e554f; --brand-soft:#e3ebe7; --on-brand:#ffffff;
  --gold:#a8792a; --gold-soft:#f6ecd9;
  --strong:#2f6b4f; --good:#56715f; --stretch:#8a6a2e;
  --urgent:#a2432f; --urgent-soft:#f7e3dd;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a18; --surface:#1c2421; --ink:#e7ece9; --muted:#9aa8a2; --line:#2e3a36;
  --brand:#8fb3a6; --brand-soft:#24332e; --on-brand:#10201a;
  --gold:#d9ad5f; --gold-soft:#33291a;
  --strong:#8fcfaa; --good:#a6c0ae; --stretch:#d9b56f;
  --urgent:#ec8f7a; --urgent-soft:#3a221d; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;justify-content:space-between;align-items:center;padding-block:20px 8px;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:20px;color:var(--brand);font-weight:600}
.logo span{font-style:italic;font-weight:500}
.valid{font-size:13px;color:var(--muted)}
.valid.expired{color:var(--urgent);font-weight:600}
.hero{padding-block:28px 8px;display:grid;gap:14px}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.15}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.recap ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.recap li{background:var(--brand-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px}

section{margin-top:36px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:24px}
.sort{display:flex;gap:6px}
.sort button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

.timeline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 10px;overflow-x:auto}
.timeline svg{display:block;width:100%;min-width:520px;height:auto}

.cards{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;transition:border-color .2s,box-shadow .2s}
.card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card-top>div{min-width:0}
.card h3{font-size:21px;line-height:1.25}
.buyer{color:var(--muted);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.pick{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.fit-strong{background:var(--brand-soft);color:var(--strong)}
.fit-good{background:var(--brand-soft);color:var(--good)}
.fit-stretch{background:var(--gold-soft);color:var(--stretch)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:0}
.fact{background:var(--surface);padding:10px 12px;min-width:0}
.fact dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.count{display:inline-block;margin-top:2px;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.count.soon{background:var(--urgent-soft);color:var(--urgent)}
.count.ok{background:var(--brand-soft);color:var(--brand)}
.why{margin:0;max-width:65ch;white-space:pre-line}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:14px}
details ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.fee small{display:block;font-size:12px;color:var(--muted)}
.fee strong{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--brand);background:transparent;color:var(--brand)}
.btn:hover{background:var(--brand-soft)}
.btn.on,.btn.solid{background:var(--brand);color:var(--on-brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.sort button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.next{background:var(--brand);color:var(--on-brand);border-radius:16px;padding:26px 24px;display:grid;gap:12px}
.next h2{font-size:24px}
.next p{margin:0;opacity:.92;max-width:60ch}
.next a{color:var(--on-brand);font-weight:600}
.small{font-size:13px;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bar-in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar-txt{font-size:14px;color:var(--muted)}
.bar-txt b{color:var(--ink);font-variant-numeric:tabular-nums}

.confirm{background:var(--surface);border:1px solid var(--brand);border-radius:14px;padding:20px;display:grid;gap:12px}
.confirm ul{margin:0;padding-left:20px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}
textarea{font:inherit;width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.done{background:var(--brand-soft);border-radius:14px;padding:20px}
.done h3{font-size:20px;margin-bottom:6px}
.err{background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:10px 12px;font-size:14px}
.empty{padding-block:80px;text-align:center;display:grid;gap:12px;justify-items:center}

@media (max-width:620px){.facts{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="bar" role="region" aria-label="Your selection" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-txt" id="barTxt">No tenders selected yet</div>
    <button class="btn solid" id="review" type="button" disabled>Review my selection</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
(function(){
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "£" + Number(n || 0).toLocaleString("en-GB");
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const parseDate = d => new Date(d + "T00:00:00");
const fmtDate = d => parseDate(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const daysLeft = d => Math.round((parseDate(d) - TODAY) / 86400000);
const fitLabel = {strong:"Strong fit", good:"Good fit", stretch:"Worth considering"};
const fitRank = {strong:0, good:1, stretch:2};

/* ---------- Read the shortlist from the link ---------- */
let data = null;
try {
  const raw = new URLSearchParams(location.search).get("s");
  if (raw) data = JSON.parse(LZString.decompressFromEncodedURIComponent(raw));
} catch(e) { data = null; }

if (!data || !Array.isArray(data.tenders) || !data.tenders.length) {
  app.innerHTML = `<div class="empty">
    <div class="logo">Bid<span>Elevate</span></div>
    <h1 style="font-size:28px">This shortlist link looks incomplete</h1>
    <p class="small" style="max-width:46ch">Please try opening the link from our email again. If it still doesn't work, call us on ${esc(CONFIG.PHONE)} and we'll resend it.</p>
  </div>`;
  return;
}

const tenders = data.tenders.map((t,i) => ({...t, id:"t"+i, needs:(t.needs||[]).filter(Boolean)}));
const selected = new Set();
const sentKey = "be-shortlist-sent-" + (new URLSearchParams(location.search).get("s") || "").slice(-40);
let sortBy = "fit";
let confirmed = false;
try { confirmed = localStorage.getItem(sentKey) === "1"; } catch(e) {}

document.title = `Tender shortlist for ${data.org} | BidElevate`;

/* ---------- Page shell ---------- */
const validDate = data.validUntil ? parseDate(data.validUntil) : null;
const expired = validDate && validDate < TODAY;
const validTxt = validDate ? (expired ? "This shortlist has expired. Contact us for an updated list." : "Shortlist valid until " + validDate.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})) : "";
const n = tenders.length;

app.innerHTML = `
  <header class="top">
    <div class="logo">Bid<span>Elevate</span></div>
    <div class="valid ${expired?'expired':''}">${esc(validTxt)}</div>
  </header>
  <div class="hero">
    <div class="eyebrow">Your tender shortlist</div>
    <h1>Hi ${esc(data.contact)}, here ${n===1?'is the opportunity':'are '+n+' opportunities'} we found for ${esc(data.org)}</h1>
    <p>Thank you for your discovery call. We've searched current tenders, frameworks and Dynamic Purchasing Systems that match the service you described. Take a look, choose any you'd like support with, and we'll take it from there. There's no obligation.</p>
    ${data.tags && data.tags.length ? `<div class="recap"><div class="eyebrow">What you told us</div><ul>${data.tags.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
  </div>
  <section>
    <div class="sec-head"><h2>Deadlines at a glance</h2><span class="small">Today: ${TODAY.toLocaleDateString("en-GB",{day:"numeric",month:"long"})}</span></div>
    <div class="timeline" id="timeline"></div>
  </section>
  <section>
    <div class="sec-head">
      <h2>Your opportunities</h2>
      ${n>1?`<div class="sort" role="group" aria-label="Sort tenders">
        <button type="button" id="sortFit" aria-pressed="true">Best fit</button>
        <button type="button" id="sortDate" aria-pressed="false">Deadline</button>
      </div>`:""}
    </div>
    <div class="cards" id="cards"></div>
  </section>
  <section id="confirmArea"></section>
  <section>
    <div class="next">
      <div class="eyebrow" style="color:inherit;opacity:.8">What happens next</div>
      <h2>Choose your tenders, then we'll book a kickoff call</h2>
      <p>Once you confirm your choice, we'll send a short agreement and a link to book your kickoff call. On that call we'll plan the timeline, agree what evidence we need from you, and get started on the bid.</p>
      <p>Prefer to talk it through first? <a href="${esc(CONFIG.BOOKING_URL)}" target="_blank" rel="noopener">Book a quick call</a> or ring us on ${esc(CONFIG.PHONE)}.</p>
    </div>
    <p class="small" style="margin-top:14px">Fees are fixed per bid and agreed before work starts. Tender details are taken from the buyer's published notice. Always check the buyer's portal for the latest documents and clarifications.</p>
  </section>`;

document.getElementById("bar").hidden = false;

/* ---------- Cards ---------- */
function countdown(d){
  const k = daysLeft(d);
  if (k < 0) return '<span class="count soon">Closed</span>';
  if (k === 0) return '<span class="count soon">Closes today</span>';
  return `<span class="count ${k<=21?'soon':'ok'}">${k} day${k===1?'':'s'} left</span>`;
}

function renderCards(){
  const list = [...tenders].sort((a,b)=> sortBy==="fit"
    ? ((b.pick?1:0)-(a.pick?1:0)) || fitRank[a.fit]-fitRank[b.fit]
    : (a.deadline||"").localeCompare(b.deadline||""));
  document.getElementById("cards").innerHTML = list.map(t=>{
    const on = selected.has(t.id);
    const closed = t.deadline && daysLeft(t.deadline) < 0;
    const facts = [["Route",t.route],["Value",t.value],["Length",t.length]].filter(f=>f[1]);
    return `<article class="card ${on?'selected':''}">
      <div class="card-top">
        <div><h3>${esc(t.title)}</h3><div class="buyer">${esc(t.buyer)}${t.lot?' · '+esc(t.lot):''}</div></div>
        <div class="chips">${t.pick?'<span class="chip pick">★ Our recommendation</span>':''}${t.fit?`<span class="chip fit-${esc(t.fit)}">${fitLabel[t.fit]||''}</span>`:''}</div>
      </div>
      <dl class="facts">
        ${facts.map(f=>`<div class="fact"><dt>${f[0]}</dt><dd>${esc(f[1])}</dd></div>`).join("")}
        ${t.deadline?`<div class="fact"><dt>Deadline</dt><dd>${fmtDate(t.deadline)}<br>${countdown(t.deadline)}</dd></div>`:''}
      </dl>
      ${t.why?`<p class="why"><strong>Why it fits you.</strong> ${esc(t.why)}</p>`:''}
      ${t.needs.length?`<details><summary>What we'd need from you</summary><ul>${t.needs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:''}
      <div class="card-foot">
        <div class="fee"><small>Our fee to write this bid</small><strong>${money(t.fee)}</strong></div>
        <button type="button" class="btn ${on?'on':''}" data-id="${t.id}" aria-pressed="${on}" ${(confirmed||closed||expired)?'disabled':''}>${closed?'Closed':on?'✓ Selected':'Select this tender'}</button>
      </div>
    </article>`;
  }).join("");
  document.querySelectorAll(".card .btn").forEach(b=> b.onclick = ()=>{
    const id = b.dataset.id;
    selected.has(id) ? selected.delete(id) : selected.add(id);
    renderCards(); renderBar(); renderTimeline();
  });
}

function renderBar(){
  const picks = tenders.filter(t=>selected.has(t.id));
  const total = picks.reduce((s,t)=>s+Number(t.fee||0),0);
  const txt = document.getElementById("barTxt"), btn = document.getElementById("review");
  if (confirmed){ txt.innerHTML = "<b>Selection sent.</b> We'll be in touch within one working day."; btn.hidden = true; return; }
  if (expired){ txt.textContent = "This shortlist has expired. Please contact us for an updated list."; btn.hidden = true; return; }
  txt.innerHTML = picks.length ? `<b>${picks.length}</b> tender${picks.length>1?'s':''} selected · Total <b>${money(total)}</b>` : "No tenders selected yet";
  btn.disabled = !picks.length;
}

/* ---------- Timeline ---------- */
function renderTimeline(){
  const dated = tenders.filter(t=>t.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const box = document.getElementById("timeline");
  if (!dated.length){ box.closest("section").hidden = true; return; }
  const W=760,H=160,pad=50;
  const last = parseDate(dated[dated.length-1].deadline);
  const end = new Date(Math.max(last.getTime(), TODAY.getTime()) + 21*86400000);
  const start = TODAY;
  const span = end - start;
  const x = d => pad + Math.max(0,Math.min(1,(d - start)/span)) * (W - pad*2);
  let months = "";
  const m = new Date(start.getFullYear(), start.getMonth()+1, 1);
  while (m <= end){
    const xi = x(m);
    months += `<line x1="${xi}" y1="76" x2="${xi}" y2="84" stroke="var(--muted)"/><text x="${xi}" y="100" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="DM Sans, sans-serif">${m.toLocaleDateString("en-GB",{month:"short"})}</text>`;
    m.setMonth(m.getMonth()+1);
  }
  const dots = dated.map((t,i)=>{
    const xi = x(parseDate(t.deadline)), up = i%2===0, on = selected.has(t.id);
    const ly = up ? 44 : 128;
    const words = t.title.split(/\s+/);
    const short = words.slice(0,3).join(" ") + (words.length>3?"…":"");
    return `<line x1="${xi}" y1="80" x2="${xi}" y2="${up?52:116}" stroke="var(--line)"/>
      <circle cx="${xi}" cy="80" r="${on?8:6}" fill="${on?'var(--brand)':'var(--surface)'}" stroke="var(--brand)" stroke-width="2"/>
      <text x="${xi}" y="${ly}" font-size="12" text-anchor="middle" fill="var(--ink)" font-family="DM Sans, sans-serif" font-weight="${on?600:400}">${esc(short)}</text>
      <text x="${xi}" y="${ly+(up?-16:16)}" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="DM Sans, sans-serif">${fmtDate(t.deadline).replace(/ \d{4}$/,'')}</text>`;
  }).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of tender deadlines">
    <line x1="${pad}" y1="80" x2="${W-pad}" y2="80" stroke="var(--muted)" stroke-width="1.5"/>
    <circle cx="${pad}" cy="80" r="4" fill="var(--gold)"/>
    <text x="${pad}" y="100" font-size="12" text-anchor="middle" fill="var(--gold)" font-family="DM Sans, sans-serif" font-weight="600">Today</text>
    ${months}${dots}</svg>`;
}

/* ---------- Confirm and send ---------- */
function showConfirm(){
  const picks = tenders.filter(t=>selected.has(t.id));
  const total = picks.reduce((s,t)=>s+Number(t.fee||0),0);
  const area = document.getElementById("confirmArea");
  area.innerHTML = `<div class="confirm">
    <h2 style="font-size:22px">Confirm your selection</h2>
    <ul>${picks.map(t=>`<li>${esc(t.title)} · <strong>${money(t.fee)}</strong>${t.deadline?' · due '+fmtDate(t.deadline):''}</li>`).join("")}</ul>
    <div><strong>Total: ${money(total)}</strong></div>
    <label for="note" class="small">Anything you'd like us to know? (optional)</label>
    <textarea id="note" placeholder="For example: we'd like to start with the DPS, or our registered manager will join the kickoff call."></textarea>
    <div id="sendErr" class="err" hidden></div>
    <div class="row"><button class="btn solid" id="send" type="button">Send my selection</button><button class="btn" id="cancel" type="button">Keep browsing</button></div>
  </div>`;
  area.scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("cancel").onclick = ()=>{ area.innerHTML = ""; };
  document.getElementById("send").onclick = ()=> send(picks, total);
}

async function send(picks, total){
  const btn = document.getElementById("send"), err = document.getElementById("sendErr");
  btn.disabled = true; btn.textContent = "Sending…"; err.hidden = true;
  const note = document.getElementById("note").value.trim();
  const th = 'padding:10px 12px;font-family:Arial,sans-serif;font-size:12px;color:#3e554f;text-transform:uppercase;letter-spacing:1px;';
  const rowsHtml = picks.map(t=>`<tr>
      <td style="padding:10px 12px;border-bottom:1px solid #dbe2dd;color:#1f2b27;font-family:Arial,sans-serif;font-size:14px;"><strong>${esc(t.title)}</strong><br><span style="color:#5d6b66;">${esc(t.buyer)}${t.lot?' · '+esc(t.lot):''}</span></td>
      <td style="padding:10px 12px;border-bottom:1px solid #dbe2dd;color:#1f2b27;font-family:Arial,sans-serif;font-size:14px;white-space:nowrap;">${t.deadline?fmtDate(t.deadline):'n/a'}</td>
      <td style="padding:10px 12px;border-bottom:1px solid #dbe2dd;color:#1f2b27;font-family:Arial,sans-serif;font-size:14px;text-align:right;white-space:nowrap;">${money(t.fee)}</td>
    </tr>`).join("");
  const rows = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border:1px solid #dbe2dd;">
    <tr style="background:#e3ebe7;"><th align="left" style="${th}">Tender</th><th align="left" style="${th}">Deadline</th><th align="right" style="${th}">Fee</th></tr>
    ${rowsHtml}
    <tr><td colspan="2" style="padding:12px;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#1f2b27;">Total</td><td align="right" style="padding:12px;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;color:#1f2b27;">${money(total)}</td></tr>
  </table>`;
  const params = {
    to_email: CONFIG.NOTIFY_EMAIL,
    reply_to: data.email || CONFIG.NOTIFY_EMAIL,
    contact_name: data.contact,
    org_name: data.org,
    contact_email: data.email || "Not provided",
    selected_count: String(picks.length),
    selected_table: rows,
    selected_text: picks.map(t=>`• ${t.title} (${t.buyer}) – ${money(t.fee)} – due ${t.deadline?fmtDate(t.deadline):'n/a'}`).join("\n"),
    total_fee: money(total),
    client_note: note || "No note left.",
    submitted_at: new Date().toLocaleString("en-GB",{dateStyle:"full",timeStyle:"short"}),
    shortlist_link: location.href
  };
  try{
    emailjs.init({publicKey: CONFIG.EMAILJS_PUBLIC_KEY});
    await emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, params);
    confirmed = true;
    try { localStorage.setItem(sentKey, "1"); } catch(e) {}
    document.getElementById("confirmArea").innerHTML = `<div class="done"><h3>Thank you, ${esc(data.contact)}. Your selection has been sent.</h3><p style="margin:0">We'll email you a short agreement and a link to book your kickoff call within one working day.</p></div>`;
    renderCards(); renderBar();
  } catch(e){
    btn.disabled = false; btn.textContent = "Send my selection";
    err.hidden = false;
    err.textContent = `Your selection didn't send. Please check your internet connection and try again. If it still doesn't work, call us on ${CONFIG.PHONE} and we'll take your choice over the phone.`;
    console.error("EmailJS error", e);
  }
}

/* ---------- Wire up ---------- */
document.getElementById("review").onclick = showConfirm;
const sf = document.getElementById("sortFit"), sd = document.getElementById("sortDate");
if (sf && sd){
  sf.onclick = ()=>{ sortBy="fit"; sf.setAttribute("aria-pressed","true"); sd.setAttribute("aria-pressed","false"); renderCards(); };
  sd.onclick = ()=>{ sortBy="date"; sd.setAttribute("aria-pressed","true"); sf.setAttribute("aria-pressed","false"); renderCards(); };
}
if (confirmed){
  document.getElementById("confirmArea").innerHTML = `<div class="done"><h3>Your selection has already been sent</h3><p style="margin:0">Thank you. We'll be in touch within one working day. If you'd like to change anything, call us on ${esc(CONFIG.PHONE)}.</p></div>`;
}
renderCards(); renderBar(); renderTimeline();
})();
</script>
</body>
</html>
